name: Protected Kira Web deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: kira-web-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      ${{ github.repository == 'kira-manga/kira-web' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'kira-manga/kira-web/.github/workflows/deploy.yml@refs/heads/main' &&
          github.workflow_sha == github.sha && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      snapshot: ${{ steps.policy.outputs.snapshot }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze source, successful verification and native policy
        id: policy
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.WEB_PRODUCTION_POLICY_READ_TOKEN }}
        run: python3 scripts/ci/deployment_policy.py preflight

  deploy:
    needs: preflight
    if: >-
      ${{ needs.preflight.result == 'success' &&
          github.repository == 'kira-manga/kira-web' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'kira-manga/kira-web/.github/workflows/deploy.yml@refs/heads/main' &&
          github.workflow_sha == github.sha && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck frozen preflight after native approval
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.WEB_PRODUCTION_POLICY_READ_TOKEN }}
          WEB_DEPLOYMENT_SNAPSHOT: ${{ needs.preflight.outputs.snapshot }}
        run: python3 scripts/ci/deployment_policy.py recheck
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build verified exact-SHA image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: kira-web:${{ github.sha }}
          build-args: |
            KIRA_WEB_PRODUCTION=true
            ANDROID_APP_SHA256_CERT_FINGERPRINT=${{ vars.ANDROID_APP_SHA256_CERT_FINGERPRINT }}
            APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}
            IOS_BUNDLE_ID=${{ vars.IOS_BUNDLE_ID }}
            ANDROID_PACKAGE_NAME=${{ vars.ANDROID_PACKAGE_NAME }}
            NEXT_PUBLIC_KIRA_API_URL=https://api.kiramanga.me
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Recheck frozen preflight after build, immediately before SSH
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.WEB_PRODUCTION_POLICY_READ_TOKEN }}
          WEB_DEPLOYMENT_SNAPSHOT: ${{ needs.preflight.outputs.snapshot }}
        run: python3 scripts/ci/deployment_policy.py recheck
      - name: Stream image and deploy
        env:
          DEPLOY_KEY: ${{ secrets.WEB_PRODUCTION_SSH_PRIVATE_KEY }}
          PINNED_KNOWN_HOSTS: ${{ secrets.WEB_PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SERVER3_HOST }}
          DEPLOY_PORT: ${{ vars.SERVER3_PORT }}
          DEPLOY_USER: ${{ vars.SERVER3_USER }}
          REVISION: ${{ github.sha }}
        run: bash scripts/ci/deploy-web.sh
