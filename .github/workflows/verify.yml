name: Web source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-verify:
    name: web-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Deployment policy, workflow and shell regression checks
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Public release verifier native TLS fixture
        run: node scripts/test-verify-deployment.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and standalone build
        env:
          KIRA_WEB_SOURCE_REVISION: ${{ github.sha }}
        run: npm run verify
